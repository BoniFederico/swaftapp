# electron-builder — packages the electron-vite build (apps/desktop/out) into distributables.
# See ../../docs/dev/releasing.md for the release process (tag push → CI builds → GitHub Release).
appId: com.swaft.desktop
productName: Swaft
copyright: Copyright © 2026 Federico Boni

directories:
  # Icons live in buildResources/ because `build/` is gitignored at the repo root.
  buildResources: buildResources
  output: release

# App payload. Production node_modules (sql.js, hash-wasm, seebo, mermaid, echarts, codemirror, …)
# are collected automatically by electron-builder from the hoisted npm-workspaces tree, so they must
# NOT be listed here — only the built output and the manifest.
files:
  - out/**
  - package.json

# sql.js reads its .wasm from disk at runtime, so keep it unpacked (outside the asar) or the path
# won't resolve. hash-wasm inlines its wasm as base64, so it needs no unpack.
asarUnpack:
  - '**/node_modules/sql.js/dist/*.wasm'

win:
  target:
    - target: nsis
      arch: [x64]

# Assisted (non one-click) installer: license page, per-user by default with an optional
# per-machine choice, a chooseable directory, and Start-menu + desktop shortcuts.
nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  license: ../../LICENSE
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Swaft
  uninstallDisplayName: Swaft ${version}
  artifactName: ${productName}-${version}-setup.${ext}

mac:
  # One dmg per architecture (Apple silicon + Intel). Builds are unsigned until a Developer ID
  # certificate is configured — see docs/installation.md for opening an unsigned app.
  target:
    - target: dmg
      arch: [arm64, x64]
  category: public.app-category.developer-tools
  artifactName: ${productName}-${version}-${arch}.${ext}

dmg:
  title: Swaft ${version}

linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  category: Development
  synopsis: Desktop workspace for templates, HTTP requests, code and visual scenarios
  maintainer: Federico Boni <federicoboni67@gmail.com>
  artifactName: ${productName}-${version}-${arch}.${ext}

deb:
  artifactName: swaft_${version}_amd64.${ext}

# Releases are published by .github/workflows/release.yml (which uploads the installers itself);
# local `npm run dist` never publishes.
publish:
  provider: github
  owner: BoniFederico
  repo: swaftapp
