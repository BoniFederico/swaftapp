# electron-builder — packages the electron-vite build (apps/desktop/out) into distributables.
# See ../../deploy.md for the release strategy (tag-based release, free-tier minute budget, signing).
appId: com.swaft.desktop
productName: Swaft
copyright: Copyright © 2026 Swaft

directories:
  # Icons live in buildResources/ because `build/` is gitignored at the repo root.
  buildResources: buildResources
  output: release

# App payload. Production node_modules (sql.js, hash-wasm, seebo, mermaid, echarts, codemirror, …)
# are collected automatically by electron-builder from the hoisted npm-workspaces tree, so they must
# NOT be listed here — only the built output and the manifest.
files:
  - out/**
  - package.json

# sql.js reads its .wasm from disk at runtime, so keep it unpacked (outside the asar) or the path
# won't resolve. hash-wasm inlines its wasm as base64, so it needs no unpack.
asarUnpack:
  - '**/node_modules/sql.js/dist/*.wasm'

win:
  # Code signing is env-driven and opt-in: set CSC_LINK (path/URL/base64 of a .pfx) + CSC_KEY_PASSWORD
  # to sign exe/uninstaller/installer via signtool; absent → an unsigned (but valid) build. See
  # deploy.md §7 and scripts/gen-selfsigned-cert.ps1 for local testing.
  target:
    - target: nsis
      arch: [x64]

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  artifactName: ${productName}-${version}-setup.${ext}

mac:
  # arm64-only by default to keep the (×10-cost) macOS job cheap — add `x64` here when Intel Macs
  # need a native build (see deploy.md §5.4).
  target:
    - target: dmg
      arch: [arm64]
  category: public.app-category.developer-tools
  artifactName: ${productName}-${version}-${arch}.${ext}

linux:
  target:
    - target: AppImage
      arch: [x64]
  category: Development
  artifactName: ${productName}-${version}.${ext}

# GitHub Releases as the distribution feed (see deploy.md §5/§8) — also drives the latest.yml update
# metadata generated at build time. owner/repo are set explicitly so the build never depends on
# parsing .git/config (a malformed local remote otherwise crashes the update-info step).
publish:
  provider: github
  owner: BoniFederico
  repo: swaftapp
