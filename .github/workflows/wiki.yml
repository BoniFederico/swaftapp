name: Docs (GitHub Wiki)

# Mirror docs/ into the GitHub Wiki. docs/ is the single source of truth: the wiki is regenerated from
# it on every docs change on main (scripts/docs-to-wiki.mjs), so edits made directly in the wiki are
# overwritten. The wiki git repo only exists once its first page has been created in the web UI.
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'scripts/docs-to-wiki.mjs'
      - '.github/workflows/wiki.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wiki
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Check out the wiki
        run: |
          if ! git clone --depth 1 "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" wiki; then
            echo "::error::The wiki repository does not exist yet. Open https://github.com/${GITHUB_REPOSITORY}/wiki, create the first page (any content), then re-run this workflow."
            exit 1
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: node scripts/docs-to-wiki.mjs docs wiki
      - name: Commit and push
        working-directory: wiki
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Wiki already up to date.'
            exit 0
          fi
          git commit -m "Sync wiki from docs/ @ ${GITHUB_SHA::7}"
          git push
