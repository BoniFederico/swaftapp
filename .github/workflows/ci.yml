name: CI

# Checks on every PR and push to main: typecheck, lint, unit/component tests, then a production build
# and the Playwright-for-Electron smoke test (under a virtual display). The two heavy jsdom suites
# (SWAFT_RUN_HEAVY_TESTS) stay opt-in.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Supersede in-flight runs on the same ref so rapid pushes don't pile up.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      # Shared libraries Electron needs on a bare runner (same set Playwright's browsers use).
      - run: npx playwright install-deps
      - run: xvfb-run --auto-servernum npm run e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: test-results/
          if-no-files-found: ignore
